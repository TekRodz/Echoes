<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#efe4cc" />
  <title>Échos — prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="loop-badge">
        <div class="sq" id="loopIcon"></div>
        <div>
          <p class="loop-title" id="loopTitle">Boucle I</p>
          <p class="loop-sub" id="loopSub">sur III</p>
        </div>
      </div>
      <div class="top-right">
        <div class="stab" id="stab" role="img" aria-label="Stabilité"></div>
        <button type="button" class="icon-btn" id="pauseBtn" aria-label="Pause"></button>
      </div>
    </header>

    <div class="timeline">
      <div class="bar" id="bar">
        <div class="track"></div>
        <div class="fill" id="barFill"></div>
        <div class="marks" id="barMarks"></div>
        <div class="cursor" id="barCursor"></div>
        <input type="range" id="scrub" min="0" max="1200" step="1" value="0" aria-label="Aperçu de boucle : position dans le temps" />
      </div>
      <p class="time" id="time">00:00</p>
    </div>
    <p class="objective" id="objective"></p>

    <div id="stage">
      <canvas id="canvas"></canvas>
      <div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="overlay" id="overlay" hidden></div>
    </div>

    <div class="actionrow" id="actionrow">
      <div class="classinfo" id="classinfo"></div>
      <button type="button" class="primary" id="launchBtn">Lancer la boucle</button>
      <button type="button" class="ability" id="abilityBtn" aria-label="Compétence"></button>
    </div>
    <div class="cards" id="cards"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
